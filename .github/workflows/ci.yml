name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (Ubuntu / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks and CLI smoke tests
        run: npm test

      - name: Run project-owned Node.js tests
        shell: bash
        run: |
          test_files=()
          while IFS= read -r -d '' file; do
            test_files+=("$file")
          done < <(find . \
            -path './node_modules' -prune -o \
            -path './tools' -prune -o \
            -path './.git' -prune -o \
            -type f \
            \( -name '*.test.js' -o -name '*.test.mjs' -o -name '*.spec.js' -o -name '*.spec.mjs' \) \
            -print0)
          if (( ${#test_files[@]} == 0 )); then
            echo "No project-owned Node.js test files found; skipping test runner."
          else
            node --test "${test_files[@]}"
          fi

      - name: Check shell script syntax
        shell: bash
        run: |
          shopt -s nullglob
          scripts=( ./*.sh )
          if (( ${#scripts[@]} == 0 )); then
            echo "No shell scripts found; skipping."
          else
            bash -n "${scripts[@]}"
          fi

      - name: Build desktop frontend
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  desktop-rust:
    name: Desktop Rust checks (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run desktop backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  desktop-rust-windows:
    name: Desktop Rust check (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Check Windows desktop backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
